group 'com.xraph.plugin.flutter_unity_widget'
version '4.0-SNAPSHOT'

buildscript {
    ext.kotlin_version = '1.6.20'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:4.1.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()

        // DO NOT MODIFY
        // BUILD_ADD_UNITY_LIBS

        // FOR DEV ONLY
        flatDir {
            dirs "libs"
        }
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace "com.xraph.plugin.flutter_unity_widget"
    compileSdk 36

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }
    defaultConfig {
        minSdkVersion 34
    }
    lintOptions {
        disable 'InvalidPackage'
    }

    compileOptions {
        sourceCompatibility 1.8
        targetCompatibility 1.8
    }
}

def lifecycle_version = '2.4.1'
def annotation_version = '1.3.0'

dependencies {
    implementation project(':unityLibrary')
    // Compile against the exported Unity 6 jar, but do not package it.
    // unityLibrary already ships the same classes. Packaging both fails
    // :app:checkDebugDuplicateClasses.
    def unityJar = new File(rootProject.projectDir, "unityLibrary/unityLibrary/libs/unity-classes.jar")
    if (unityJar.exists()) {
        compileOnly files(unityJar)
    } else {
        compileOnly(name: 'unity-classes', ext: 'jar')
    }

    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    implementation "androidx.lifecycle:lifecycle-common:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-common-java8:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-process:$lifecycle_version"
    implementation "androidx.annotation:annotation:$annotation_version"

    compileOnly rootProject.findProject(":flutter_plugin_android_lifecycle")

    // FOR DEV ONLY
//    implementation(name: 'flutter', ext:'jar')
}
